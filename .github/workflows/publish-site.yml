name: Publish site & firmware

# Що робить цей workflow:
#   1) при кожному пуші в main — збирає сайт (tools/build-site.mjs) і публікує його на GitHub Pages;
#   2) збирає прошивку з espcode/espcode.ino у .bin і кладе її на сайт
#      (site/releases/smart-lamp-<версія>.bin) разом із SHA-256;
#   3) оновлює releases/index.json + manifest.json, які читає лампа для автооновлення;
#   4) при пуші тегу v* — додатково створює GitHub Release із цим .bin.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lamp-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build site assets (effects + manifest links)
        run: node tools/build-site.mjs

      - name: Install arduino-cli
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ESP32 core (Arduino)
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "Adafruit NeoPixel"

      - name: Provide secrets.h for the build
        run: |
          cd espcode
          [ -f secrets.h ] || cp secrets.example.h secrets.h

      - name: Lint firmware (gzip-ассети, версія, сумісність mbedtls)
        run: |
          python3 - <<'PY'
          import re, sys, gzip
          src = open('espcode/espcode.ino', encoding='utf-8').read()
          errs = []

          # 1) mbedtls 3.x (ESP32 core >= 3.0) прибрав функції з суфіксом _ret.
          #    Такі виклики ламають збірку — ловимо до компіляції, з підказкою.
          for fn in re.findall(r'\b(mbedtls_\w+_ret)\s*\(', src):
              errs.append(f'{fn}() не існує в mbedtls 3.x — приберіть суфікс _ret')

          # 2) Версія у прошивці має збігатися з тією, що очікує сайт
          m = re.search(r'#define\s+FW_VERSION\s+"([^"]+)"', src)
          if m:
              import json, os
              print(f'FW_VERSION = {m.group(1)}')
          else:
              errs.append('не знайдено #define FW_VERSION')

          for e in errs:
              print(f'::error::{e}')
          sys.exit(1 if errs else 0)
          PY

      - name: Verify embedded web assets are gzip
        run: |
          python3 - <<'PY'
          import re, sys
          h = open('espcode/web_assets.h', encoding='utf-8').read()
          # кожен ассет має починатися з 0x1f, 0x8b (магія gzip) — інакше лампа віддасть сміття
          blocks = re.findall(r'static const uint8_t asset_\d+\[\] PROGMEM = \{\s*\n\s*0x([0-9a-f]{2}),\s*0x([0-9a-f]{2}),', h)
          bad = [b for b in blocks if b != ('1f', '8b')]
          print(f'ассетів: {len(blocks)}, не gzip: {len(bad)}')
          if bad:
              print('::error::web_assets.h містить нестиснуті дані — перегенеруйте tools/gen_web_assets.py')
              sys.exit(1)
          if not blocks:
              print('::error::web_assets.h не містить ассетів')
              sys.exit(1)
          PY

      - name: Compile firmware (esp32c3)
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn esp32:esp32:esp32c3:CDCOnBoot=cdc,PartitionScheme=min_spiffs \
            --output-dir build \
            espcode
          ls -la build

      - name: Prepare release .bin + checksum
        id: bin
        run: |
          set -euo pipefail
          VER=$(grep -oP '#define\s+FW_VERSION\s+"\K[^"]+' espcode/espcode.ino)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          mkdir -p site/releases
          SRC=build/espcode.ino.bin
          [ -f "$SRC" ] || SRC=$(ls build/*.ino.bin | head -1)
          cp "$SRC" "site/releases/smart-lamp-$VER.bin"
          SIZE=$(stat -c%s "site/releases/smart-lamp-$VER.bin")
          SHA=$(sha256sum "site/releases/smart-lamp-$VER.bin" | cut -d' ' -f1)
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Зібрано v$VER, $SIZE байт, sha256=$SHA"

      - name: Update releases index
        run: |
          node tools/update-releases.mjs \
            --version "${{ steps.bin.outputs.version }}" \
            --file "releases/smart-lamp-${{ steps.bin.outputs.version }}.bin" \
            --size "${{ steps.bin.outputs.size }}" \
            --sha256 "${{ steps.bin.outputs.sha }}" \
            --notes-from-data
          node tools/build-site.mjs
          cat site/releases/manifest.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          # службові файли не мають потрапляти на публічний сайт
          exclude: |
            **/README.md
            **/.*

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-lamp-firmware-${{ steps.bin.outputs.version }}
          path: site/releases/smart-lamp-${{ steps.bin.outputs.version }}.bin

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.bin.outputs.version }}"
          gh release create "v$VER" "site/releases/smart-lamp-$VER.bin" \
            --title "Smart Lamp v$VER" \
            --notes-file "site/releases/notes-$VER.md" --verify-tag || \
          gh release create "v$VER" "site/releases/smart-lamp-$VER.bin" \
            --title "Smart Lamp v$VER" --generate-notes || true

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages може бути не увімкнено — тоді деплой падає з незрозумілою 404.
      # Перевіряємо заздалегідь і, якщо вимкнено, не валимо збірку, а даємо інструкцію.
      - name: Check GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "✅ GitHub Pages увімкнено"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages не увімкнено::Сайт зібрано, але не опубліковано. Увімкніть: Settings → Pages → Source: GitHub Actions (https://github.com/${{ github.repository }}/settings/pages)"
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4

      - name: Explain what to do when Pages is off
        if: steps.pages.outputs.enabled != 'true'
        run: |
          {
            echo "### ⚠️ Сайт зібрано, але GitHub Pages вимкнено"
            echo ""
            echo "Прошивку \`.bin\` і сайт зібрано успішно — вони лежать в **Artifacts** цього запуску."
            echo ""
            echo "Щоб опублікувати сайт:"
            echo "1. Відкрийте [Settings → Pages](https://github.com/${{ github.repository }}/settings/pages)"
            echo "2. **Source** → виберіть **GitHub Actions** → Save"
            echo "3. Перезапустіть деплой: \`gh run rerun ${{ github.run_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
