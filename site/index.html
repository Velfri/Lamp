      <div>
        <span class="eyebrow"><i></i><span data-i18n="hero.badge"></span>&nbsp;<b class="ver-inline" id="badge-ver"></b></span>
        <h1><span data-i18n="hero.h1"></span></h1>
        <p class="lede" data-i18n-html="hero.lede"></p>
        <div class="hero-cta">
          <a class="btn primary lg" href="#update">
            <svg class="i"><use href="#i-dl"/></svg><span id="cta-dl" data-i18n="hero.cta1"></span>
          </a>
          <a class="btn lg" href="#install">
            <svg class="i"><use href="#i-install"/></svg><span data-i18n="hero.cta2"></span>
          </a>

          <span><svg class="i"><use href="#i-fx"/></svg><b id="m-fx" data-fx-count>30+</b>&nbsp;<span data-i18n="hero.meta.fx"></span></span>
          <span><svg class="i"><use href="#i-shield"/></svg><span data-i18n="hero.meta.ota"></span></span>
          <span class="ver-badge" id="m-ver">v2.1.0</span>
        </div>
      </div>

      <div class="stage" id="stage" aria-label="Live lamp preview">
        <canvas id="lamp-canvas" aria-hidden="true"></canvas>
        <div class="stage-tag">
          <span class="dot"></span>
          <label class="sr" for="fx-select">Effect</label>
          <select id="fx-select"></select>
        </div>
        <button class="stage-power" id="fx-power" data-on="true" type="button" aria-pressed="true" aria-label="Power">
          <svg class="i"><use href="#i-power"/></svg>
        </button>
      </div>
    </div>

    <div class="wrap">
      <div class="strip">
        <div><b>50</b><small data-i18n="strip.fps"></small></div>
        <div><b data-fx-count>30+</b><small data-i18n="strip.fx"></small></div>
        <div><b>1024</b><small data-i18n="strip.leds"></small></div>
        <div><b>0</b><small data-i18n="strip.cloud"></small></div>
